[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-dashboard"
version = "0.1.0"
description = "Unified dashboard package for feed and trading monitors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "dash>=3.12",
  "pandas>=2.1",
  "plotly>=5.24",
  "numpy>=1.26",
  "pyarrow>=16.0",
]

[project.scripts]
feed-live = "feed_live.__main__:main"
feed-daily = "feed_daily.__main__:main"
trade-sim = "trade_sim.__main__:main"
trade-livesim = "trade_livesim.__main__:main"
algo-docs = "algo_docs.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["algo_docs", "feed_daily", "feed_live", "feed_live.*", "trade_sim", "trade_livesim"]
